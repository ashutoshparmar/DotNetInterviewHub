plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashutosh.dotnetinterviewhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ashutosh.dotnetinterviewhub'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.2.0'
    }

    signingConfigs {
        personalDebug {
            storeFile file('personal-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.personalDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally dependency-free: the app uses Android framework APIs only.
}
